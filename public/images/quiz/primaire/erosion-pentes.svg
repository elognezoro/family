<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 236" width="300" height="236" role="img" aria-label="Deux pentes sous la pluie. Pente A : couverte d’herbe et d’arbres, la terre reste en place. Pente B : sans plantes, des rigoles de boue descendent et la terre s’accumule en bas dans une flaque marron">
  <!-- pluie -->
  <g stroke="#3b82c4" stroke-width="2.5" stroke-linecap="round">
    <line x1="22" y1="12" x2="17" y2="24"/><line x1="52" y1="8" x2="47" y2="20"/><line x1="82" y1="14" x2="77" y2="26"/><line x1="112" y1="8" x2="107" y2="20"/><line x1="138" y1="16" x2="133" y2="28"/>
    <line x1="37" y1="34" x2="32" y2="46"/><line x1="97" y1="32" x2="92" y2="44"/><line x1="127" y1="40" x2="122" y2="52"/>
    <line x1="172" y1="12" x2="167" y2="24"/><line x1="202" y1="8" x2="197" y2="20"/><line x1="232" y1="14" x2="227" y2="26"/><line x1="262" y1="8" x2="257" y2="20"/><line x1="288" y1="16" x2="283" y2="28"/>
    <line x1="187" y1="34" x2="182" y2="46"/><line x1="247" y1="32" x2="242" y2="44"/><line x1="277" y1="40" x2="272" y2="52"/>
  </g>
  <!-- pente A : terre couverte de plantes -->
  <path d="M8 196 L8 120 Q60 70 142 150 L142 196 Z" fill="#8a5a33"/>
  <path d="M8 124 Q60 74 142 154 L142 162 Q60 84 8 132 Z" fill="#3f9b3a"/>
  <g stroke="#2e7d32" stroke-width="2.2" stroke-linecap="round">
    <line x1="20" y1="118" x2="18" y2="108"/><line x1="26" y1="113" x2="27" y2="103"/><line x1="44" y1="103" x2="42" y2="93"/><line x1="70" y1="98" x2="71" y2="88"/><line x1="96" y1="108" x2="94" y2="98"/><line x1="118" y1="124" x2="120" y2="114"/><line x1="130" y1="136" x2="128" y2="126"/>
  </g>
  <rect x="52" y="74" width="5" height="24" fill="#6b4423"/><circle cx="54" cy="68" r="14" fill="#2e8b3a"/>
  <rect x="100" y="90" width="5" height="22" fill="#6b4423"/><circle cx="102" cy="85" r="12" fill="#2e8b3a"/>
  <g stroke="#c9a27a" stroke-width="1.5" fill="none" opacity="0.9">
    <path d="M54 100 q-6 10 -12 14 M54 100 q6 10 12 14 M102 114 q-5 9 -10 12 M102 114 q5 9 10 12"/>
  </g>
  <!-- pente B : sol nu, rigoles de boue -->
  <path d="M158 196 L158 120 Q210 70 292 150 L292 196 Z" fill="#a8693a"/>
  <path d="M158 124 Q210 74 292 154 L292 160 Q210 82 158 130 Z" fill="#b97a47"/>
  <g stroke="#5a3418" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M196 92 Q204 120 214 150 Q220 170 226 190"/>
    <path d="M236 108 Q244 132 252 160 Q256 176 262 190"/>
    <path d="M176 106 Q180 132 186 158 Q190 176 192 190"/>
  </g>
  <!-- terre emportée : mottes qui glissent le long des rigoles -->
  <g fill="#5a3418">
    <circle cx="208" cy="132" r="3.5"/><circle cx="218" cy="160" r="4"/><circle cx="249" cy="146" r="3.5"/><circle cx="257" cy="172" r="4"/><circle cx="183" cy="142" r="3"/><circle cx="190" cy="172" r="3.5"/>
  </g>
  <g stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M272 120 L280 138 M280 138 L272 134 M280 138 L282 129"/>
  </g>
  <ellipse cx="226" cy="206" rx="66" ry="10" fill="#7a4a24"/>
  <ellipse cx="226" cy="204" rx="52" ry="6" fill="#9a6236"/>
  <!-- sol de base -->
  <rect x="8" y="196" width="134" height="8" fill="#6b4423"/>
  <ellipse cx="75" cy="206" rx="40" ry="5" fill="#8ec7e8"/>
  <!-- repères -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111" text-anchor="middle">
    <text x="75" y="232">A</text><text x="225" y="232">B</text>
  </g>
</svg>
