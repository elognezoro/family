<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img" aria-label="Tableau noir du dépouillement de l’élection du délégué. Awa : 9 voix ; Koffi : 5 voix ; Moussa : 3 voix. Chaque voix est un bâton à la craie, barré par groupes de cinq">
  <rect x="0" y="0" width="300" height="220" rx="6" fill="#8a5a2b"/>
  <rect x="8" y="8" width="284" height="204" rx="3" fill="#24513a"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f4f1e6">
    <text x="150" y="36" font-size="17" font-weight="700" text-anchor="middle">Élection du délégué</text>
    <line x1="22" y1="46" x2="278" y2="46" stroke="#f4f1e6" stroke-width="1.5" opacity="0.7"/>
    <g font-size="18" font-weight="700"><text x="22" y="84">Awa</text><text x="22" y="128">Koffi</text><text x="22" y="172">Moussa</text></g>
    <g font-size="17"><text x="282" y="84" text-anchor="end">9 voix</text><text x="282" y="128" text-anchor="end">5 voix</text><text x="282" y="172" text-anchor="end">3 voix</text></g>
  </g>
  <g stroke="#f4f1e6" stroke-width="3" stroke-linecap="round"><line x1="104" y1="63" x2="104" y2="89"/><line x1="112" y1="63" x2="112" y2="89"/><line x1="120" y1="63" x2="120" y2="89"/><line x1="128" y1="63" x2="128" y2="89"/><line x1="100" y1="86" x2="132" y2="66"/><line x1="144" y1="63" x2="144" y2="89"/><line x1="152" y1="63" x2="152" y2="89"/><line x1="160" y1="63" x2="160" y2="89"/><line x1="168" y1="63" x2="168" y2="89"/><line x1="104" y1="107" x2="104" y2="133"/><line x1="112" y1="107" x2="112" y2="133"/><line x1="120" y1="107" x2="120" y2="133"/><line x1="128" y1="107" x2="128" y2="133"/><line x1="100" y1="130" x2="132" y2="110"/><line x1="104" y1="151" x2="104" y2="177"/><line x1="112" y1="151" x2="112" y2="177"/><line x1="120" y1="151" x2="120" y2="177"/></g>
  <rect x="226" y="196" width="40" height="8" rx="2" fill="#f4f1e6"/>
