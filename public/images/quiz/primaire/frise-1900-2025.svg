  <rect x="51" y="50" width="38" height="38" rx="6" fill="#e8f0fb" stroke="#1A2A1A" stroke-width="2"/><text x="70" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A2A1A" text-anchor="middle">A</text><line x1="70" y1="88" x2="70" y2="114" stroke="#1A2A1A" stroke-width="2" stroke-dasharray="4 3"/><rect x="147" y="50" width="38" height="38" rx="6" fill="#fdf3e1" stroke="#1A2A1A" stroke-width="2"/><text x="166" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A2A1A" text-anchor="middle">B</text><line x1="166" y1="88" x2="166" y2="114" stroke="#1A2A1A" stroke-width="2" stroke-dasharray="4 3"/><rect x="219" y="50" width="38" height="38" rx="6" fill="#eaf7ea" stroke="#1A2A1A" stroke-width="2"/><text x="238" y="76" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#1A2A1A" text-anchor="middle">C</text><line x1="238" y1="88" x2="238" y2="114" stroke="#1A2A1A" stroke-width="2" stroke-dasharray="4 3"/>
