<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" role="img" aria-label="Frise chronologique, du passé (à gauche) vers aujourd’hui (à droite), graduée 1900, 1950, 2000 et 2025. Case A entre 1900 et 1950, case B entre 1950 et 2000, case C entre 2000 et 2025">
