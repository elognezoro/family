<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 220" width="300" height="220" role="img" aria-label="Une affiche punaisée au mur. Elle porte seulement une phrase écrite en grosses lettres : « Arrosons les plantes de l’école ! ». Il n’y a aucun dessin">
  <rect x="0" y="0" width="300" height="220" fill="#f3efe6"/>
  <rect x="34" y="20" width="232" height="184" rx="4" fill="#fffdf5" stroke="#1E9E57" stroke-width="4"/>
  <circle cx="54" cy="34" r="7" fill="#e1001a"/><circle cx="246" cy="34" r="7" fill="#e1001a"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#0E6B3A" text-anchor="middle">
    <text x="150" y="88">Arrosons</text>
    <text x="150" y="124">les plantes</text>
    <text x="150" y="160">de l’école !</text>
  </g>
</svg>
