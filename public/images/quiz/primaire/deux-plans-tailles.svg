<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 176" width="300" height="176" role="img" aria-label="Deux plans de la même classe, vus de dessus. Plan A : le tableau est un trait vert plus long qu’une table, et les quatre tables ont toutes la même taille. Plan B : le tableau est un tout petit trait vert, trois tables ont la taille normale, mais la quatrième table est énorme, bien plus grande que les autres et que le tableau">
