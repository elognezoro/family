<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 332" width="300" height="332" role="img" aria-label="Plan de ma classe, vu de dessus. Le contour de la salle est un grand rectangle (les murs). Le tableau est un trait vert épais contre le mur du haut, avec le bureau du maître (rectangle marron) juste devant. La porte (un trait et un quart de cercle rouges) est sur le mur de gauche, en haut, près du tableau. Deux fenêtres (petits rectangles bleus) sont sur le mur de droite. Neuf tables d’élèves (rectangles beiges) sont rangées en 3 rangées de 3. Une légende sous le plan explique chaque signe : bureau du maître, table d’élève, porte, tableau, fenêtre">
  <rect width="300" height="332" fill="#fffdf7"/><text x="150" y="24" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1A2A1A" text-anchor="middle">Plan de ma classe</text><rect x="30" y="36" width="240" height="170" fill="#fffdf7" stroke="#1A2A1A" stroke-width="5"/><rect x="26" y="52" width="8" height="34" fill="#fffdf7"/><line x1="30" y1="52" x2="64" y2="52" stroke="#d4351c" stroke-width="3"/><path d="M64 52 A34 34 0 0 1 30 86" fill="none" stroke="#d4351c" stroke-width="2"/><rect x="266" y="70" width="8" height="40" fill="#cfe6ff" stroke="#2b7bd6" stroke-width="2"/><rect x="266" y="140" width="8" height="40" fill="#cfe6ff" stroke="#2b7bd6" stroke-width="2"/><rect x="95" y="39" width="110" height="8" fill="#1f6b45"/><rect x="128" y="58" width="44" height="20" fill="#8b4a2b"/><rect x="62" y="102" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="128" y="102" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="194" y="102" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="62" y="136" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="128" y="136" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="194" y="136" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="62" y="170" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="128" y="170" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="194" y="170" width="44" height="20" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><rect x="18" y="218" width="264" height="104" rx="6" fill="#ffffff" stroke="#9a9a9a" stroke-width="1.5"/><text x="30" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1A2A1A">Légende</text><rect x="28" y="251" width="26" height="14" fill="#8b4a2b"/><text x="62" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A1A">bureau du maître</text><rect x="28" y="275" width="26" height="14" fill="#f0d9a8" stroke="#8b5a2b" stroke-width="1.5"/><text x="62" y="287" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A1A">table d’élève</text><line x1="32" y1="315" x2="52" y2="315" stroke="#d4351c" stroke-width="3"/><path d="M52 315 A20 20 0 0 0 32 295" fill="none" stroke="#d4351c" stroke-width="2"/><text x="62" y="311" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A1A">porte</text><rect x="184" y="254" width="26" height="8" fill="#1f6b45"/><text x="218" y="263" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A1A">tableau</text><rect x="193" y="275" width="8" height="26" fill="#cfe6ff" stroke="#2b7bd6" stroke-width="2"/><text x="218" y="293" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1A2A1A">fenêtre</text>
</svg>
