<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 310" width="220" height="310" role="img" aria-label="Un thermomètre à liquide : la lettre A désigne la boule du bas, la lettre B le tube étroit, la lettre C les petits traits gravés sur le côté">
  <!-- corps en verre -->
  <rect x="64" y="14" width="32" height="250" rx="16" fill="#f7fafc" stroke="#111" stroke-width="4"/>
  <!-- tube fin (vide) puis liquide -->
  <line x1="80" y1="30" x2="80" y2="256" stroke="#c9ced6" stroke-width="6" stroke-linecap="round"/>
  <line x1="80" y1="150" x2="80" y2="262" stroke="#d33" stroke-width="6" stroke-linecap="round"/>
  <!-- réservoir -->
  <circle cx="80" cy="276" r="22" fill="#d33" stroke="#111" stroke-width="4"/>
  <!-- graduations -->
  <g stroke="#111" stroke-width="2">
    <line x1="88" y1="40" x2="96" y2="40"/><line x1="88" y1="60" x2="94" y2="60"/><line x1="88" y1="80" x2="96" y2="80"/>
    <line x1="88" y1="100" x2="94" y2="100"/><line x1="88" y1="120" x2="96" y2="120"/><line x1="88" y1="140" x2="94" y2="140"/>
    <line x1="88" y1="160" x2="96" y2="160"/><line x1="88" y1="180" x2="94" y2="180"/><line x1="88" y1="200" x2="96" y2="200"/>
    <line x1="88" y1="220" x2="94" y2="220"/><line x1="88" y1="240" x2="96" y2="240"/>
  </g>
  <!-- repères A, B, C -->
  <g stroke="#111" stroke-width="2" stroke-dasharray="4 3">
    <line x1="104" y1="276" x2="160" y2="276"/>
    <line x1="82" y1="96" x2="160" y2="70"/>
    <line x1="98" y1="190" x2="160" y2="190"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" fill="#111">
    <text x="166" y="284">A</text>
    <text x="166" y="78">B</text>
    <text x="166" y="198">C</text>
  </g>
</svg>
