<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Une cuve pleine d'eau dans laquelle un flacon retourné, lui aussi rempli d'eau, reçoit par un tube des bulles de gaz qui montent et prennent la place de l'eau en haut du flacon">
  <!-- eau de la cuve -->
  <rect x="23" y="118" width="274" height="90" fill="#cfe8f7"/>
  <!-- eau dans le flacon retourné (le gaz s'accumule au-dessus) -->
  <rect x="173" y="88" width="74" height="92" fill="#cfe8f7"/>
  <rect x="173" y="33" width="74" height="55" fill="#f3f4f6"/>
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- cuve -->
    <path d="M20 100 L20 210 L300 210 L300 100"/>
    <!-- flacon retourné, ouvert vers le bas -->
    <path d="M173 180 L173 30 L247 30 L247 180"/>
    <!-- tube d'arrivée du gaz -->
    <path d="M10 60 L60 60 L60 196 L208 196"/>
  </g>
  <!-- bulles de gaz -->
  <g fill="#fff" stroke="#111" stroke-width="3">
    <circle cx="214" cy="176" r="6"/>
    <circle cx="206" cy="152" r="7"/>
    <circle cx="216" cy="128" r="7"/>
    <circle cx="208" cy="104" r="8"/>
  </g>
</svg>
