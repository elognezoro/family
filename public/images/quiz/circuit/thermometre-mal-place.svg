<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 260" width="240" height="260" role="img" aria-label="Un bécher contenant un liquide ; un thermomètre y est plongé, et sa boule du bas est posée contre le fond du bécher">
  <!-- liquide -->
  <path d="M53 120 L53 230 Q53 237 60 237 L180 237 Q187 237 187 230 L187 120 Z" fill="#cfe8f7"/>
  <!-- bécher -->
  <path d="M50 60 L50 230 Q50 240 60 240 L180 240 Q190 240 190 230 L190 60" fill="none" stroke="#111" stroke-width="5" stroke-linejoin="round"/>
  <path d="M50 60 L40 52" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>
  <!-- thermomètre : la boule touche le fond -->
  <rect x="110" y="8" width="20" height="208" rx="10" fill="#f7fafc" stroke="#111" stroke-width="3"/>
  <line x1="120" y1="20" x2="120" y2="214" stroke="#c9ced6" stroke-width="4" stroke-linecap="round"/>
  <line x1="120" y1="110" x2="120" y2="220" stroke="#d33" stroke-width="4" stroke-linecap="round"/>
  <circle cx="120" cy="225" r="13" fill="#d33" stroke="#111" stroke-width="3"/>
</svg>
