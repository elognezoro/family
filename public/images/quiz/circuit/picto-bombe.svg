    <line x1="104" y1="98" x2="122" y2="80"/>
    <line x1="110" y1="110" x2="136" y2="104"/>
    <line x1="96" y1="88" x2="100" y2="62"/>
    <line x1="112" y1="124" x2="134" y2="132"/>
  </g>
  <!-- éclats projetés -->
  <g fill="#111">
    <path d="M126 66 L136 62 L134 72 Z"/>
    <path d="M144 92 L154 96 L146 102 Z"/>
    <path d="M100 50 L108 46 L108 56 Z"/>
    <path d="M140 118 L150 120 L144 128 Z"/>
    <path d="M118 52 L124 48 L126 56 Z"/>
  </g>
  <!-- trait du sol -->
  <rect x="66" y="146" width="66" height="8" fill="#111"/>
</svg>
