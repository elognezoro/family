<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Pictogramme de danger : losange à bord rouge contenant une bombe noire qui éclate, avec des éclats projetés">
  <path d="M100 13 L187 100 L100 187 L13 100 Z" fill="#fff" stroke="#e1001a" stroke-width="10" stroke-linejoin="miter"/>
  <!-- bombe qui éclate : boule noire au bord déchiqueté -->
  <path d="M60 128 C56 112 64 98 78 94 L84 86 L88 96 L98 90 L96 102 L108 104 L100 112 L110 120 L98 124 C96 136 84 144 72 142 C66 140 62 136 60 128 Z" fill="#111"/>
  <!-- traits de l'explosion -->
