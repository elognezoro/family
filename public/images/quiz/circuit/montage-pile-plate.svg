<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="Une lampe posée sur une pile plate : la pointe de la lampe touche la lame courte (borne +) et la partie à vis touche la lame longue (borne −)">
  <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- la pile plate (boîtier carré) et ses marques -->
    <rect x="40" y="150" width="130" height="120"/>
    <!-- lame longue (borne −) depuis le coin gauche jusqu'au culot ; lame courte (borne +) depuis le coin droit jusqu'au plot -->
    <line x1="40" y1="150" x2="129" y2="92"/>
    <line x1="170" y1="150" x2="142" y2="122"/>
    <!-- la lampe -->
    <circle cx="142" cy="48" r="28"/>
    <path d="M129 76 L129 108 L155 108 L155 76"/>
    <line x1="129" y1="86" x2="155" y2="86"/>
    <line x1="129" y1="97" x2="155" y2="97"/>
  </g>
  <polygon points="132,108 152,108 142,122" fill="#111"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" text-anchor="middle">
    <text x="66" y="182">−</text>
    <text x="146" y="182">+</text>
  </g>
</svg>
