<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280" role="img" aria-label="Une lampe posée sur le téton d'une pile cylindrique (borne +) ; un fil de connexion part du fond de la pile (borne −), contourne la pile et rejoint la partie à vis de la lampe">
  <g fill="none" stroke="#111" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <!-- la lampe -->
    <circle cx="100" cy="38" r="28"/>
    <path d="M87 64 L87 94 L113 94 L113 64"/>
    <line x1="87" y1="76" x2="113" y2="76"/>
    <line x1="87" y1="86" x2="113" y2="86"/>
    <!-- la pile cylindrique : téton (+) en haut, fond plat (−) en bas -->
    <rect x="92" y="106" width="16" height="12"/>
    <rect x="60" y="118" width="80" height="130"/>
    <!-- le fil de connexion : du fond de la pile jusqu'au culot -->
    <path d="M100 248 L100 264 L190 264 L190 80 L113 80" stroke-width="3"/>
  </g>
  <polygon points="92,94 108,94 100,106" fill="#111"/>
  <g fill="#111" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="24" text-anchor="middle">
    <text x="100" y="150">+</text>
    <text x="100" y="238">−</text>
  </g>
</svg>
