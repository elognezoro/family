<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" role="img" aria-label="Schéma : une pile en bas, une lampe en haut, un interrupteur fermé, et un fil supplémentaire qui relie directement les deux bornes de la lampe en passant au-dessus d'elle">
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- fil du haut avec la lampe -->
    <line x1="30" y1="60" x2="133" y2="60"/>
    <circle cx="160" cy="60" r="27"/>
    <line x1="141" y1="41" x2="179" y2="79"/>
    <line x1="179" y1="41" x2="141" y2="79"/>
    <line x1="187" y1="60" x2="290" y2="60"/>
    <!-- fil qui court-circuite la lampe : relie ses deux bornes en passant au-dessus -->
    <path d="M110 60 L110 14 L210 14 L210 60" stroke-width="6"/>
    <!-- côtés -->
    <line x1="30" y1="60" x2="30" y2="190"/>
    <line x1="290" y1="60" x2="290" y2="190"/>
    <!-- fil du bas : interrupteur fermé puis pile -->
    <line x1="30" y1="190" x2="80" y2="190"/>
    <line x1="80" y1="190" x2="125" y2="186"/>
    <line x1="125" y1="190" x2="196" y2="190"/>
    <line x1="196" y1="163" x2="196" y2="217" stroke-width="4"/>
    <line x1="212" y1="177" x2="212" y2="203" stroke-width="9"/>
    <line x1="212" y1="190" x2="290" y2="190"/>
  </g>
  <g fill="#111">
    <circle cx="80" cy="190" r="6"/>
    <circle cx="125" cy="190" r="6"/>
    <circle cx="110" cy="60" r="6"/>
    <circle cx="210" cy="60" r="6"/>
  </g>
</svg>
