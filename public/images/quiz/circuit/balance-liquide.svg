  <path d="M242 148 L398 148 L408 200 L232 200 Z" fill="#e6e9ed" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="276" y="160" width="88" height="28" rx="4" fill="#1d2b22" stroke="#333" stroke-width="2"/>
  <text x="356" y="181" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#7CFC9A" text-anchor="end">180 g</text>
