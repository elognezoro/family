<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 210" width="420" height="210" role="img" aria-label="Deux balances électroniques. À gauche, le récipient vide : la balance affiche 80 g. À droite, le même récipient rempli de liquide : la balance affiche 180 g">
