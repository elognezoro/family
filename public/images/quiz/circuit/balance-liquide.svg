  <text x="100" y="22" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#111" text-anchor="middle">récipient vide</text>
  
  <path d="M70 56 L72 140 L128 140 L130 56" fill="none" stroke="#333" stroke-width="3" stroke-linejoin="round"/>
  <line x1="66" y1="56" x2="134" y2="56" stroke="#333" stroke-width="3" stroke-linecap="round"/>
  <rect x="40" y="140" width="120" height="8" rx="2" fill="#b8bec7" stroke="#333" stroke-width="2"/>
  <path d="M22 148 L178 148 L188 200 L12 200 Z" fill="#e6e9ed" stroke="#333" stroke-width="2.5" stroke-linejoin="round"/>
  <rect x="56" y="160" width="88" height="28" rx="4" fill="#1d2b22" stroke="#333" stroke-width="2"/>
  <text x="136" y="181" font-family="Courier New, monospace" font-size="23" font-weight="700" fill="#7CFC9A" text-anchor="end">80 g</text>
</g>
  <g>
