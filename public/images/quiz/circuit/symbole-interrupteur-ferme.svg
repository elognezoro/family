<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" width="240" height="100" role="img" aria-label="Symbole normalisé : un trait continu dont le levier, abaissé, relie les deux points de contact">
  <g fill="none" stroke="#111" stroke-width="7" stroke-linecap="round">
    <line x1="8" y1="62" x2="90" y2="62"/>
    <line x1="90" y1="62" x2="150" y2="56"/>
    <line x1="150" y1="62" x2="232" y2="62"/>
  </g>
  <g fill="#111">
    <circle cx="90" cy="62" r="8"/>
    <circle cx="150" cy="62" r="8"/>
  </g>
</svg>
