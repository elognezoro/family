<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 210" width="320" height="210" role="img" aria-label="Schéma normalisé d'un circuit : en haut une lampe (cercle barré d'une croix), en bas à gauche un interrupteur ouvert, en bas à droite une pile (deux traits parallèles), le tout relié en boucle par des fils">
  <g fill="none" stroke="#111" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <!-- fil du haut avec la lampe -->
    <line x1="30" y1="40" x2="133" y2="40"/>
    <circle cx="160" cy="40" r="27"/>
    <line x1="141" y1="21" x2="179" y2="59"/>
    <line x1="179" y1="21" x2="141" y2="59"/>
    <line x1="187" y1="40" x2="290" y2="40"/>
    <!-- côtés -->
    <line x1="30" y1="40" x2="30" y2="170"/>
    <line x1="290" y1="40" x2="290" y2="170"/>
    <!-- fil du bas : interrupteur ouvert puis pile -->
    <line x1="30" y1="170" x2="80" y2="170"/>
    <line x1="80" y1="170" x2="118" y2="146"/>
    <line x1="125" y1="170" x2="196" y2="170"/>
    <line x1="196" y1="143" x2="196" y2="197" stroke-width="4"/>
    <line x1="212" y1="157" x2="212" y2="183" stroke-width="9"/>
    <line x1="212" y1="170" x2="290" y2="170"/>
  </g>
  <g fill="#111">
    <circle cx="80" cy="170" r="6"/>
    <circle cx="125" cy="170" r="6"/>
  </g>
</svg>
