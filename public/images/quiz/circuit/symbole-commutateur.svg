    <line x1="156" y1="26" x2="232" y2="26"/>
    <line x1="156" y1="88" x2="232" y2="88"/>
  </g>
  <g fill="#111">
    <circle cx="80" cy="58" r="8"/>
    <circle cx="156" cy="26" r="8"/>
    <circle cx="156" cy="88" r="8"/>
  </g>
</svg>
